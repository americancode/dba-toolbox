apiVersion: v1
kind: Service
metadata:
  name: {{ include "dba-toolbox.fullname" . }}
  labels:
    {{- include "dba-toolbox.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "dba-toolbox.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
