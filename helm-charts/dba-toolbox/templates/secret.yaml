apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dba-toolbox.fullname" . }}-connections
  labels:
    {{- include "dba-toolbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_COUNT: {{ len .Values.connections.minio | quote }}
  {{- $root := . }}
  {{- range $index, $name := keys .Values.connections.minio | sortAlpha }}
  {{- $connection := index $root.Values.connections.minio $name }}
  MINIO_{{ $index }}_ALIAS: {{ default $name $connection.alias | quote }}
  {{- if $connection.existingSecret.name }}
  {{- end }}
  {{- if and $connection.existingSecret.name $connection.existingSecret.endpointKey }}
  {{- else }}
  MINIO_{{ $index }}_ENDPOINT: {{ required (printf "connections.minio[%d].endpoint is required" $index) $connection.endpoint | quote }}
  {{- end }}
  {{- if and $connection.existingSecret.name $connection.existingSecret.accessKeyKey }}
  {{- else }}
  MINIO_{{ $index }}_ACCESS_KEY: {{ required (printf "connections.minio[%d].accessKey is required" $index) $connection.accessKey | quote }}
  {{- end }}
  {{- if and $connection.existingSecret.name $connection.existingSecret.secretKeyKey }}
  {{- else }}
  MINIO_{{ $index }}_SECRET_KEY: {{ required (printf "connections.minio[%d].secretKey is required" $index) $connection.secretKey | quote }}
  {{- end }}
  MINIO_{{ $index }}_API: {{ default "S3v4" $connection.api | quote }}
  MINIO_{{ $index }}_PATH: {{ default "auto" $connection.path | quote }}
  {{- with $connection.bucket }}
  MINIO_{{ $index }}_BUCKET: {{ . | quote }}
  {{- end }}
  {{- end }}
  POSTGRES_COUNT: {{ len .Values.connections.postgres | quote }}
  {{- range $index, $name := keys .Values.connections.postgres | sortAlpha }}
  {{- $connection := index $root.Values.connections.postgres $name }}
  POSTGRES_{{ $index }}_SERVICE: {{ default $name $connection.service | quote }}
  {{- $connectionStringKey := default $connection.connectionStringKey $connection.existingSecret.connectingStringKey }}
  {{- if $connection.existingSecret.name }}
  {{- end }}
  {{- if not (or (and $connection.existingSecret.name $connection.existingSecret.hostKey) (and $connection.existingSecret.name $connectionStringKey)) }}
  POSTGRES_{{ $index }}_HOST: {{ required (printf "connections.postgres[%d].host is required unless connectingStringKey is set" $index) $connection.host | quote }}
  {{- end }}
  POSTGRES_{{ $index }}_PORT: {{ default 5432 $connection.port | quote }}
  {{- if not (or (and $connection.existingSecret.name $connection.existingSecret.databaseKey) (and $connection.existingSecret.name $connectionStringKey)) }}
  POSTGRES_{{ $index }}_DATABASE: {{ required (printf "connections.postgres[%d].database is required unless databaseKey is set" $index) $connection.database | quote }}
  {{- end }}
  {{- if not (or (and $connection.existingSecret.name $connection.existingSecret.userKey) (and $connection.existingSecret.name $connectionStringKey)) }}
  POSTGRES_{{ $index }}_USER: {{ required (printf "connections.postgres[%d].user is required unless userKey is set" $index) $connection.user | quote }}
  {{- end }}
  {{- if and (not (and $connection.existingSecret.name $connection.existingSecret.passwordKey)) (not (and $connection.existingSecret.name $connectionStringKey)) }}
  POSTGRES_{{ $index }}_PASSWORD: {{ required (printf "connections.postgres[%d].password is required unless passwordKey or connectingStringKey is set" $index) $connection.password | quote }}
  {{- end }}
  {{- with $connection.sslmode }}
  POSTGRES_{{ $index }}_SSLMODE: {{ . | quote }}
  {{- end }}
  {{- end }}
